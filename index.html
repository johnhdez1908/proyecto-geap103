html<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEAP-103-OLA: Proyecto Final GitHub</title>
    <style>
        /* Estilos generales de la aplicación con colores institucionales */
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f4f7f6; 
            text-align: center; 
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1); 
        }
        h1 { 
            color: #002244; 
            font-size: 24px;
        }
        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }
        textarea { 
            width: 100%; 
            height: 80px; 
            padding: 10px; 
            margin-bottom: 10px; 
            border-radius: 4px; 
            border: 1px solid #ccc; 
            font-size: 16px; 
            box-sizing: border-radius;
            resize: none;
        }
        button { 
            background-color: #ffc72c; /* Amarillo estilo Humber */
            color: #002244;
            border: none; 
            padding: 10px 15px; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
            margin: 5px; 
            transition: 0.2s;
        }
        button:hover { 
            background-color: #e0ae26; 
        }
        .text-display { 
            font-size: 22px; 
            line-height: 1.6; 
            margin-top: 20px; 
            text-align: left; 
            padding: 15px; 
            background: #fafafa; 
            border-radius: 4px; 
            border-left: 4px solid #002244;
        }
        .word { 
            display: inline-block; 
            margin-right: 6px; 
            cursor: pointer; 
            border-radius: 3px; 
            padding: 2px 4px; 
            transition: 0.1s;
        }
        .word:hover { 
            background-color: #ffe082; 
        }
        .highlight { 
            background-color: #ffeb3b; 
            font-weight: bold; 
            transform: scale(1.05);
        }
        /* Contenedor interactivo para la ayuda visual */
        .popover { 
            margin-top: 20px; 
            padding: 15px; 
            border: 2px dashed #ffc72c; 
            display: none; 
            background: #fffde7; 
            border-radius: 5px; 
            text-align: left; 
        }
        .popover img {
            margin-top: 10px; 
            border-radius: 4px; 
            max-width: 150px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Language Learning App Prototype</h1>
    <div class="subtitle">Comp. Applic. 1: PC Essentials (GEAP-103-OLA)</div>
    
    <p>Escribe tu frase en inglés o usa el ejemplo predeterminado:</p>
    
    <!-- Texto precargado para que hagas tu simulación en clase -->
    <textarea id="textInput">The beautiful garden has flowers</textarea>
    <br>
    
    <button onclick="prepareText()">1. Cargar Texto</button>
    <button onclick="speakText()">2. Escuchar y Seguir</button>
    <button onclick="pauseSpeech()">Pausar</button>

    <!-- Aquí se mostrarán las palabras para hacerles clic -->
    <div id="textDisplay" class="text-display">Presiona "1. Cargar Texto" para iniciar.</div>
    
    <!-- Cuadro de ayuda visual flotante -->
    <div id="popover" class="popover"></div>
</div>

<script>
    // Variables globales para controlar la API de Voz del navegador web
    let synthesis = window.speechSynthesis;
    let utterance;
    let wordsArray = [];

    // PASO 1: Separa el texto en palabras individuales e interactivas
    function prepareText() {
        const rawText = document.getElementById('textInput').value;
        const displayContainer = document.getElementById('textDisplay');
        displayContainer.innerHTML = ''; // Limpiar contenedor
        
        if (!rawText.trim()) {
            displayContainer.innerText = "Por favor escribe un texto primero.";
            return;
        }

        // Divide el texto usando los espacios en blanco
        wordsArray = rawText.trim().split(/\s+/);
        
        wordsArray.forEach((word, index) => {
            let span = document.createElement('span');
            span.innerText = word;
            span.className = 'word';
            span.id = 'word-' + index;
            
            // Evento interactivo: pausar y ver traducción si se hace clic
            span.onclick = function() { showWordDetails(word); };
            displayContainer.appendChild(span);
        });
    }

    // PASO 2: Reproduce el audio y activa el resaltado dinámico (Highlight)
    function speakText() {
        // Si ya estaba pausado, simplemente continúa la lectura
        if (synthesis.speaking && synthesis.paused) {
            synthesis.resume();
            return;
        }

        const rawText = document.getElementById('textInput').value;
        if (!rawText.trim()) return;

        // Si no se ha cargado el texto visualmente, lo genera automáticamente
        if (document.querySelectorAll('.word').length === 0) {
            prepareText();
        }

        utterance = new SpeechSynthesisUtterance(rawText);
        utterance.lang = 'en-US'; // Configurado en idioma Inglés Americano

        // El evento "onboundary" detecta exactamente qué palabra está procesando el software de audio
        utterance.onboundary = function(event) {
            if (event.name === 'word') {
                // Remueve el resaltado de la palabra anterior
                document.querySelectorAll('.word').forEach(el => el.classList.remove('highlight'));
                
                // Calcula la posición y el índice real de la palabra actual
                let textUpToBoundary = event.target.text.substr(0, event.charIndex);
                let wordIndex = textUpToBoundary.trim().split(/\s+/).length;
                if(event.charIndex === 0) wordIndex = 0;

                // Aplica el efecto visual amarillo a la palabra sonando
                let currentSpan = document.getElementById('word-' + wordIndex);
                if (currentSpan) {
                    currentSpan.classList.add('highlight');
                }
            }
        };

        // Quita los colores cuando el audio llegue a su fin
        utterance.onend = function() {
            document.querySelectorAll('.word').forEach(el => el.classList.remove('highlight'));
        };

        synthesis.speak(utterance);
    }

    // Función para pausar el reproductor
    function pauseSpeech() {
        if (synthesis.speaking && !synthesis.paused) {
            synthesis.pause();
        }
    }

    // PASO 3: Diccionario local dinámico y demostración visual con gráficos
    function showWordDetails(word) {
        pauseSpeech(); // Detiene la voz general inmediatamente
        
        // Limpia signos de puntuación de la palabra para buscarla con precisión
        let cleanWord = word.toLowerCase().replace(/[^a-z]/g, "");
        
        let popover = document.getElementById('popover');
        popover.style.display = 'block';
        
        // Base de datos de simulación interactiva con imágenes reales de Unsplash
        let dictionary = {
            "beautiful": { trans: "Hermoso / Bella", img: "https://unsplash.com" },
            "garden": { trans: "Jardín", img: "https://unsplash.com" },
            "flowers": { trans: "Flores", img: "https://unsplash.com" }
        };

        if (dictionary[cleanWord]) {
            popover.innerHTML = `
                <strong>📌 Palabra seleccionada:</strong> ${cleanWord} <br>
                <strong>📝 Traducción al español:</strong> ${dictionary[cleanWord].trans} <br>
                <strong>📸 Ejemplo Gráfico:</strong> <br>
                <img src="${dictionary[cleanWord].img}" alt="${cleanWord}">
            `;
        } else {
            popover.innerHTML = `
                <strong>📌 Palabra seleccionada:</strong> ${cleanWord} <br>
                <em>(Para la demostración de la clase, haz clic en "beautiful", "garden" o "flowers" para desplegar la traducción y el gráfico de ejemplo).</em>
            `;
        }
        
        // Pronunciar individualmente sólo la palabra en la que se hizo clic
        let wordUtterance = new SpeechSynthesisUtterance(cleanWord);
        wordUtterance.lang = 'en-US';
        synthesis.speak(wordUtterance);
    }
</script>

</body>
</html>
