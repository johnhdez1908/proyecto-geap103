html<!DOCTYPE html>
<!-- translate="no" es una regla estricta para que Chrome no rompa los botones -->
<html lang="en" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEAP-103-OLA: Analizador Gramatical por Colores</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h1 { color: #002244; font-size: 24px; }
        .subtitle { color: #555; font-size: 14px; margin-bottom: 20px; }
        textarea { width: 100%; height: 60px; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; resize: none; box-sizing: border-box; }
        button { background-color: #ffc72c; color: #002244; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 4px; margin: 5px; }
        button:hover { background-color: #e0ae26; }
        
        .text-display { font-size: 24px; line-height: 2; margin-top: 20px; text-align: left; padding: 15px; background: #fafafa; border-radius: 4px; border-left: 4px solid #002244; }
        .word { display: inline-block; margin-right: 8px; cursor: pointer; border-radius: 4px; padding: 2px 6px; font-weight: 500; color: white; transition: 0.2s; border: 2px solid transparent; }
        
        .articulo { background-color: #2196f3 !important; }  
        .adjetivo { background-color: #4caf50 !important; }  
        .sustantivo { background-color: #ff9800 !important; } 
        .verbo { background-color: #f44336 !important; }      
        .desconocido { background-color: #9e9e9e !important; } 

        .highlight { 
            border: 2px solid #000000 !important;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.5);
            transform: scale(1.1);
        }
        
        .legend { display: flex; justify-content: space-around; margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

        .sentence-translation { margin-top: 15px; padding: 12px; background-color: #e3f2fd; border-left: 4px solid #2196f3; text-align: left; border-radius: 4px; font-size: 16px; display: none; }
        .popover { margin-top: 20px; padding: 15px; border: 2px dashed #ffc72c; display: none; background: #fffde7; border-radius: 5px; text-align: left; }
        .popover img { margin-top: 10px; border-radius: 4px; max-width: 150px; display: block; box-shadow: 0px 2px 5px rgba(0,0,0,0.1); }
        .grammar-tag { display: inline-block; background-color: #002244; color: white; padding: 2px 6px; border-radius: 3px; font-size: 12px; font-weight: bold; margin-top: 4px; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container" translate="no" class="notranslate">
    <h1>Language Learning App Prototype</h1>
    <div class="subtitle">Comp. Applic. 1: PC Essentials (GEAP-103-OLA)</div>
    
    <p>Frase en inglés para el análisis por colores:</p>
    <textarea id="textInput">The beautiful garden has flowers</textarea>
    <br>
    
    <button onclick="prepareText()">1. Cargar Texto</button>
    <button onclick="speakText()">2. Escuchar y Seguir</button>
    <button onclick="pauseSpeech()">Pausar</button>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2196f3;"></span> Artículo</div>
        <div class="legend-item"><span class="dot" style="background:#4caf50;"></span> Adjetivo</div>
        <div class="legend-item"><span class="dot" style="background:#ff9800;"></span> Sustantivo</div>
        <div class="legend-item"><span class="dot" style="background:#f44336;"></span> Verbo</div>
    </div>

    <div id="textDisplay" class="text-display">Presiona "1. Cargar Texto" para iniciar.</div>
    
    <div id="sentenceTranslation" class="sentence-translation"></div>
    <div id="popover" class="popover"></div>
</div>

<script>
    let synthesis = window.speechSynthesis;
    let utterance;
    let wordsArray = [];

    const localDictionary = {
        "the": { trans: "El / La / Los / Las", type: "Artículo", className: "articulo", desc: "Acompaña al sustantivo para indicar su género y número.", img: "https://unsplash.com" },
        "beautiful": { trans: "Hermoso / Bella", type: "Adjetivo", className: "adjetivo", desc: "Califica o da una cualidad al sustantivo.", img: "https://unsplash.com" },
        "garden": { trans: "Jardín", type: "Sustantivo (o nombre)", className: "sustantivo", desc: "Nombra a personas, animales, cosas, lugares o ideas.", img: "https://unsplash.com" },
        "has": { trans: "Tiene (del verbo tener)", type: "Verbo", className: "verbo", desc: "Expresa la acción, el estado o el proceso que realiza el sujeto.", img: "https://unsplash.com" },
        "flowers": { trans: "Flores", type: "Sustantivo (o nombre)", className: "sustantivo", desc: "Nombra a personas, animales, cosas, lugares o ideas.", img: "https://unsplash.com" }
    };

    function prepareText() {
        const rawText = document.getElementById('textInput').value;
        const displayContainer = document.getElementById('textDisplay');
        const sentenceBox = document.getElementById('sentenceTranslation');
        
        document.getElementById('popover').style.display = 'none';
        displayContainer.innerHTML = '';
        
        if (!rawText.trim()) return;
        wordsArray = rawText.trim().split(/\s+/);
        
        wordsArray.forEach((word, index) => {
            let span = document.createElement('span');
            span.innerText = word;
            span.id = 'word-' + index;
            
            let clean = word.toLowerCase().replace(/[^a-z]/g, "");
            if (localDictionary[clean]) {
                span.className = 'word ' + localDictionary[clean].className;
            } else {
                span.className = 'word desconocido';
            }
            
            span.onclick = function() { showWordDetails(word); };
            displayContainer.appendChild(span);
        });

        sentenceBox.style.display = 'block';
        sentenceBox.innerHTML = `<strong>🔮 Traducción de la oración:</strong> El hermoso jardín tiene flores.`;
    }

    function speakText() {
        if (synthesis.speaking && synthesis.paused) {
            synthesis.resume();
            return;
        }
        const rawText = document.getElementById('textInput').value;
        if (!rawText.trim()) return;
        if (document.querySelectorAll('.word').length === 0) prepareText();

        synthesis.cancel(); 
        utterance = new SpeechSynthesisUtterance(rawText);
        utterance.lang = 'en-US'; 

        utterance.onboundary = function(event) {
            if (event.name === 'word') {
                document.querySelectorAll('.word').forEach(el => el.classList.remove('highlight'));
                let textUpToBoundary = event.target.text.substr(0, event.charIndex);
                let wordIndex = textUpToBoundary.trim().split(/\s+/).length;
                if(event.charIndex === 0) wordIndex = 0;

                let currentSpan = document.getElementById('word-' + wordIndex);
                if (currentSpan) currentSpan.classList.add('highlight');
            }
        };

        utterance.onend = function() {
            document.querySelectorAll('.word').forEach(el => el.classList.remove('highlight'));
        };
        synthesis.speak(utterance);
    }

    function pauseSpeech() {
        if (synthesis.speaking && !synthesis.paused) synthesis.pause();
    }

    // Al hacer clic, la aplicacion habla en ingles la palabra seleccionada
    function showWordDetails(word) {
        pauseSpeech();
        let cleanWord = word.toLowerCase().replace(/[^a-z]/g, "");
        let popover = document.getElementById('popover');
        popover.style.display = 'block';
        
        if (localDictionary[cleanWord]) {
            let data = localDictionary[cleanWord];
            popover.innerHTML = `
                <strong>📌 Palabra:</strong> ${word} <br>
                <strong>📝 Traducción:</strong> <span style="color:#002244; font-weight:bold;">${data.trans}</span> <br>
                <strong>🏷️ Categoría Gramatical:</strong> <span class="grammar-tag">${data.type}</span> <br>
                <small style="color:#555; display:block; margin-bottom:5px;"><em>${data.desc}</em></small>
                <strong>📸 Ejemplo Gráfico:</strong>
                <img src="${data.img}" alt="${cleanWord}">
            `;
        } else {
            popover.innerHTML = `
                <strong>📌 Palabra seleccionada:</strong> ${word} <br>
                <em>(Haz clic en "The", "beautiful", "garden", "has" o "flowers").</em>
            `;
        }
        
        let wordUtterance = new SpeechSynthesisUtterance(cleanWord);
        wordUtterance.lang = 'en-US';
        synthesis.speak(wordUtterance);
    }
</script>

</body>
</html>
